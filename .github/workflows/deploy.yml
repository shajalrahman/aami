name: Deploy to GitHub Pages

on:
  push:
    branches: [main]          # Runs on every push to main
  workflow_dispatch:           # Also lets you trigger it manually

permissions:
  contents: write              # Needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build with Vite (output → dist/)
      - name: Build
        run: npm run build

      # 5. Deploy dist/ to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: aami.exofttechnologies.com   # your custom domain
